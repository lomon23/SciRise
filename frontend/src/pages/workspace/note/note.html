<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../style/note/note.css">
    <title>EduVerse - Resizable Layout</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="note.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    
    <nav class="toolbar">
        <button id="backBtn" class="btn-icon"><span class="material-symbols-rounded">arrow_back</span></button>
        <div class="status" id="statusMsg">Зміни збережено</div>
        <button id="saveBtn" class="btn-primary">Зберегти</button>
    </nav>

    <div class="container">
        <section class="pane left-pane" id="leftPane">
            <div class="pane-content markdown-body" id="preview"></div>
        </section>

        <div class="resizer-vertical" id="dragVertical"></div>

        <section class="right-column">
            <div class="pane top-pane" id="topPane">
                <textarea id="editor" placeholder="# Заголовок курсу..."></textarea>
            </div>
            
            <div class="resizer-horizontal" id="dragHorizontal"></div>

            <div class="pane bottom-pane">
                <div class="chat-container">
                    <div class="chat-messages">
                        <div class="empty-state">
                            <div class="ai-avatar">🤖</div>
                            <p>Я тут, щоб допомогти з текстом.</p>
                        </div>
                    </div>
                    <div class="chat-input-area">
                        <input type="text" placeholder="Запит до AI..." class="chat-input">
                    </div>
                </div>
            </div>
        </section>
    </div>
    <script src="../../../scripts/note/note.js"></script>
</body>
</html>
