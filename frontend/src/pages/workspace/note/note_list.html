<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduVerse - Мої Курси</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <link rel="stylesheet" href="../../../style/note/note_list.css">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <div id="app-container" class="app-container">

        <main class="main-content">
            
            <header class="content-header">
                <button id="menuTriggerBtn" class="menu-trigger-btn">
                    <span class="material-symbols-rounded">menu</span>
                </button>
                <div class="page-title">
                    <h1>Мої курси</h1>
                    <p>Керуй своїми знаннями</p>
                </div>
                <button id="createBtn" class="btn-primary">
                    <span class="material-symbols-rounded">add</span>
                    Створити курс
                </button>
            </header>

            <div id="notesGrid" class="notes-grid">
            </div>
            
            <div id="emptyState" class="empty-state hidden">
                <span class="material-symbols-rounded icon-large">library_books</span>
                <h3>Поки що пусто</h3>
                <p>Створи свій перший навчальний матеріал</p>
            </div>
        </main>

    </div>

    <script type="module" src="../../../scripts/main.js"></script>
    <script src="../../../scripts/note/note_list.js"></script>

</body>
</html>
