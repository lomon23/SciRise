<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduVerse - Мої Курси</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <link rel="stylesheet" href="../../../style/note/note_list.css">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <div class="app-container">

        <aside class="sidebar">
            <div class="logo-area">
                EduVerse <span>Notes</span>
            </div>

            <nav class="menu">
                <a href="#" class="menu-item active">
                    <span class="material-symbols-rounded">grid_view</span>
                    Всі курси
                </a>
                <a href="#" class="menu-item">
                    <span class="material-symbols-rounded">school</span>
                    Навчання
                </a>
                <a href="#" class="menu-item">
                    <span class="material-symbols-rounded">favorite</span>
                    Улюблене
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="avatar">U</div>
                    <div class="user-info">
                        <div class="name">User</div>
                        <div class="role">Admin</div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            
            <header class="content-header">
                <div class="page-title">
                    <h1>Мої курси</h1>
                    <p>Керуй своїми знаннями</p>
                </div>
                <button id="createBtn" class="btn-primary">
                    <span class="material-symbols-rounded">add</span>
                    Створити курс
                </button>
            </header>

            <div id="notesGrid" class="notes-grid">
                </div>
            
            <div id="emptyState" class="empty-state hidden">
                <span class="material-symbols-rounded icon-large">library_books</span>
                <h3>Поки що пусто</h3>
                <p>Створи свій перший навчальний матеріал</p>
            </div>
        </main>

    </div>

    <script src="../../../scripts/note/note_list.js"></script>
</body>
</html>
